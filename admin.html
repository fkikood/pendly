<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f5f5f7">
<title>Pendly Admin – Feedbackzentrale</title>
<link rel="stylesheet" href="/pendly/styles.css">
<style>
.adminWrap{max-width:900px;margin:auto;padding:24px 16px 60px}.adminTop{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}.adminPanel{background:#fff;border:1px solid #e5e5ea;border-radius:20px;padding:18px;margin:14px 0}.adminStats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.adminStat{background:#f5f5f7;border-radius:14px;padding:14px}.adminStat b{font-size:26px;display:block}.adminStat span,.adminMeta{font-size:13px;color:#6e6e73}.adminItem{border-top:1px solid #e5e5ea;padding:18px 0}.adminItem:first-child{border-top:0}.adminItem h3{margin:0 0 6px}.adminMessage{white-space:pre-wrap;overflow-wrap:anywhere;background:#f7f7f8;border-radius:12px;padding:12px;font-size:14px}.adminControls{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:12px}.adminControls select,.adminControls textarea{width:100%;padding:12px;border:1px solid #d2d2d7;border-radius:10px;font:inherit}.adminControls textarea{grid-column:1/-1;min-height:76px}.adminNote{border-left:3px solid #007aff;padding:8px 12px;margin:8px 0;background:#f5f8ff;white-space:pre-wrap}.adminHidden{display:none!important}.adminError{color:#b42318}.adminActions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}@media(max-width:600px){.adminControls{grid-template-columns:1fr}.adminControls textarea{grid-column:auto}}
</style>
</head>
<body>
<main class="adminWrap">
<header class="adminTop"><div><div class="logo">Pendly Admin</div><div class="adminMeta">Interne Feedback- und Fehlerzentrale</div></div><button id="signOut" class="secondary adminHidden" type="button">Abmelden</button></header>
<section class="adminPanel" id="loginPanel"><h1>Admin-Anmeldung</h1><p class="sub">Zugriff ist nur für Konten mit serverseitiger Admin-Rolle möglich.</p><div class="field"><label>E-Mail</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>Passwort</label><input id="password" type="password" autocomplete="current-password"></div><button class="primary" id="loginBtn">Anmelden</button><p id="loginMsg" class="adminError" role="status"></p></section>
<section id="dashboard" class="adminHidden">
<div class="adminStats"><div class="adminStat"><b id="countOpen">—</b><span>Offen</span></div><div class="adminStat"><b id="countProgress">—</b><span>In Arbeit</span></div><div class="adminStat"><b id="countApproval">—</b><span>Wartet auf Freigabe</span></div><div class="adminStat"><b id="countResolved">—</b><span>Erledigt</span></div></div>
<div class="adminPanel"><div class="adminActions"><h2 style="margin:0;flex:1">Meldungen</h2><select id="filter" aria-label="Status filtern"><option value="all">Alle Status</option><option value="open">Offen</option><option value="in_progress">In Arbeit</option><option value="awaiting_approval">Wartet auf Freigabe</option><option value="resolved">Erledigt</option></select><button class="secondary" id="refreshBtn">Aktualisieren</button></div><p id="loadMsg" class="sub" role="status"></p><div id="reports"></div></div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(()=> {
const URL='https://prtdkebrtgwbbwvhdfea.supabase.co';
const KEY='sb_publishable_uJcwLGRq5MW-XTdeU111AA_nDoxcD1G';
const client=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const statusLabel=s=>({open:'Offen',in_progress:'In Arbeit',awaiting_approval:'Wartet auf Freigabe',resolved:'Erledigt'}[s]||s);
let rows=[];
async function gate(){
 const {data:{session}}=await client.auth.getSession();
 const allowed=session?.user?.app_metadata?.role==='admin';
 $('loginPanel').classList.toggle('adminHidden',!!allowed);
 $('dashboard').classList.toggle('adminHidden',!allowed);
 $('signOut').classList.toggle('adminHidden',!session);
 if(session&&!allowed){$('loginMsg').textContent='Dieses Konto besitzt keine Admin-Berechtigung.';await client.auth.signOut();return;}
 if(allowed)await load();
}
async function load(){
 $('loadMsg').textContent='Meldungen werden geladen …';
 const {data,error}=await client.from('feedback_reports').select('id,email,category,subject,message,app_version,status,created_at,resolution_note').order('created_at',{ascending:false}).limit(200);
 if(error){$('loadMsg').textContent='Laden fehlgeschlagen: '+error.message;return;}
 rows=data||[];
 $('countOpen').textContent=rows.filter(x=>x.status==='open').length;
 $('countProgress').textContent=rows.filter(x=>x.status==='in_progress').length;
 $('countApproval').textContent=rows.filter(x=>x.status==='awaiting_approval').length;
 $('countResolved').textContent=rows.filter(x=>x.status==='resolved').length;
 $('loadMsg').textContent=rows.length+' Meldungen geladen.';
 render();
}
function render(){
 const f=$('filter').value;
 $('reports').innerHTML=rows.filter(r=>f==='all'||r.status===f).map(r=>'<article class="adminItem" data-id="'+esc(r.id)+'"><div class="adminActions"><h3 style="flex:1">'+esc(r.subject||'Ohne Titel')+'</h3><span class="badge">'+esc(statusLabel(r.status))+'</span></div><div class="adminMeta">'+esc(r.email)+' · '+esc(r.category)+' · '+esc(r.app_version||'Version unbekannt')+' · '+new Date(r.created_at).toLocaleString('de-DE')+'</div><p class="adminMessage">'+esc(r.message)+'</p><p class="adminMeta">Interne Notiz</p><div class="notes" aria-live="polite">Notizen werden geladen …</div><div class="adminControls"><select class="status" aria-label="Status"><option value="open" '+(r.status==='open'?'selected':'')+'>Offen</option><option value="in_progress" '+(r.status==='in_progress'?'selected':'')+'>In Arbeit</option><option value="awaiting_approval" '+(r.status==='awaiting_approval'?'selected':'')+'>Wartet auf Freigabe</option><option value="resolved" '+(r.status==='resolved'?'selected':'')+'>Erledigt</option></select><textarea class="publicReply" maxlength="2000" placeholder="Rückmeldung an den Nutzer (wird bei Erledigung per E-Mail mitgeteilt)"</textarea><textarea class="noteInput" maxlength="5000" placeholder="Interne Analyse, Lösung oder Prüfergebnis (nur Admin sichtbar)"></textarea><button class="primary saveBtn" type="button">Änderungen speichern</button></div><p class="adminMeta result" role="status"></p></article>').join('')||'<p class="sub">Keine Meldungen in diesem Filter.</p>';
 for(const el of $('reports').querySelectorAll('.adminItem')){const report=rows.find(r=>r.id===el.dataset.id);el.querySelector('.publicReply').value=report?.resolution_note||'';loadNotes(el);el.querySelector('.saveBtn').addEventListener('click',()=>save(el));}
}
async function loadNotes(el){
 const {data,error}=await client.from('feedback_admin_notes').select('note,created_at').eq('feedback_id',el.dataset.id).order('created_at',{ascending:true});
 const box=el.querySelector('.notes');
 box.innerHTML=error?'<span class="adminError">Notizen konnten nicht geladen werden.</span>':(data||[]).map(n=>'<div class="adminNote">'+esc(n.note)+'<div class="adminMeta">'+new Date(n.created_at).toLocaleString('de-DE')+'</div></div>').join('')||'<span class="adminMeta">Noch keine internen Notizen.</span>';
}
async function save(el){
 const id=el.dataset.id, status=el.querySelector('.status').value, note=el.querySelector('.noteInput').value.trim(), publicReply=el.querySelector('.publicReply').value.trim(), result=el.querySelector('.result'), btn=el.querySelector('.saveBtn');
 btn.disabled=true;result.textContent='Speichert …';
 try{
  const update={status};
  if(status==='resolved'&&publicReply)update.resolution_note=publicReply;
  const {error}=await client.from('feedback_reports').update(update).eq('id',id);
  if(error)throw error;
  if(note){const {data:{user}}=await client.auth.getUser();if(!user)throw new Error('Admin-Sitzung abgelaufen. Bitte erneut anmelden.');const {error:noteError}=await client.from('feedback_admin_notes').insert({feedback_id:id,admin_user_id:user.id,note});if(noteError)throw new Error('Status wurde gespeichert, die interne Notiz jedoch nicht: '+noteError.message);}
  result.textContent='Gespeichert. Status: '+statusLabel(status)+'.';
  await load();
 }catch(e){result.textContent='Fehler: '+e.message;}
 finally{btn.disabled=false;}
}
$('loginBtn').addEventListener('click',async()=>{ $('loginMsg').textContent='Anmeldung …';const {error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('loginMsg').textContent=error.message;return;}await gate();});
$('password').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginBtn').click();});
$('signOut').addEventListener('click',async()=>{await client.auth.signOut();await gate();});
$('refreshBtn').addEventListener('click',load);$('filter').addEventListener('change',render);
client.auth.onAuthStateChange(()=>{setTimeout(gate,0);});gate();
})();
</script>
</body></html>
